<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome GitHub v1.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            gap: 2rem;
            text-align: center;
            padding: 1rem;
            overflow: hidden;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #94a3b8;
        }

        .btn {
            padding: 0.8rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* WordArt Container */
        .wordart-container {
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* WordArt Style */
        .wordart {
            display: none;
            font-size: 4rem;
            font-weight: 900;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(
                90deg,
                #ff007f,
                #ff8000,
                #ffea00,
                #00ff66,
                #00ffff,
                #007fff,
                #7f00ff,
                #ff007f
            );
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(4px 4px 0px rgba(0, 0, 0, 0.8))
                    drop-shadow(0 0 20px rgba(255, 0, 127, 0.5));
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                       rainbow 3s linear infinite;
        }

        .wordart.active {
            display: block;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-10deg);
            }
            70% {
                transform: scale(1.15) rotate(3deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes rainbow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @media (max-width: 640px) {
            .wordart {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <h1>welcome github version 1.0</h1>

    <button id="congratBtn" class="btn">축하 버튼 누르기</button>

    <div class="wordart-container">
        <div id="wordartText" class="wordart">congratulation!</div>
    </div>

    <script>
        const button = document.getElementById('congratBtn');
        const wordart = document.getElementById('wordartText');

        button.addEventListener('click', () => {
            // Re-trigger animation if clicked again
            wordart.classList.remove('active');
            void wordart.offsetWidth; // trigger reflow
            wordart.classList.add('active');
        });
    </script>
</body>
</html>
